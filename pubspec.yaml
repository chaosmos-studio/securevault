name: securevault
description: "SecureVault — a private vault disguised as everyday apps."
publish_to: 'none'

version: 1.1.0+5

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3
  crypto: ^3.0.6
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  video_player: ^2.9.2
  share_plus: ^10.0.0
  open_file: ^3.5.10
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  file_picker: ^8.0.0
  screen_protector: ^1.4.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker_platform_interface: 2.11.1
  path_provider_platform_interface: 2.1.2
  plugin_platform_interface: 2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/RedHatText-OFL.txt
    - LICENSE

  fonts:
    - family: RedHatText
      fonts:
        - asset: assets/fonts/RedHatText-Regular.otf
        - asset: assets/fonts/RedHatText-Medium.otf
          weight: 500
        - asset: assets/fonts/RedHatText-SemiBold.otf
          weight: 600
