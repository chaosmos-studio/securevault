name: Release Android

# The version name and Play's version code come from pubspec.yaml (version: name+code), and the release notes
# from the newest block of release_notes.txt, so a release needs no inputs: Actions, Release Android, Run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check everything and keep the files as a workflow artifact, but make no tag, no GitHub release and no Play upload"
        required: false
        type: boolean
        default: false
      play_track:
        description: "Also upload the AAB to this Google Play track (needs the PLAY_SERVICE_ACCOUNT_JSON secret). Production goes up as a draft"
        required: false
        type: choice
        default: none
        options: [none, internal, alpha, beta, production]

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.RUNNER_BUILD || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      # The version the app is built with. Change it here and in tests.yml together.
      FLUTTER_VERSION: "3.44.0"
      BUILD_TOOLS: "36.0.0"
      BUNDLETOOL: "1.18.3"
      TITLE: SecureVault
      DRY_RUN: ${{ inputs.dry_run }}
      PLAY_TRACK: ${{ inputs.play_track }}
      GH_TOKEN: ${{ github.token }}
      # Everything the merged manifest may ask for: the video player's two normal permissions and androidx's own.
      EXPECTED_PERMISSIONS: >-
        android.permission.ACCESS_NETWORK_STATE
        android.permission.WAKE_LOCK
        com.shravangoswami.securevault.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
    steps:
      - uses: actions/checkout@v5

      - name: Read the version and the release notes
        run: |
          set -euo pipefail
          mkdir -p build/release/whatsnew
          python3 - <<'EOF'
          import re, sys

          PLAY_LIMIT = 500

          def fail(path, message):
              print(f"::error file={path}::{message}")
              sys.exit(1)

          match = re.search(r"^version: ([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)\s*$", open("pubspec.yaml").read(), re.M)
          if not match:
              fail("pubspec.yaml", "the version line must be name+code, such as version: 1.1.0+5")
          version, code = match.group(1), int(match.group(2))
          if not 1 <= code <= 2100000000:
              fail("pubspec.yaml", f"version code {code} is outside Play's 1 to 2100000000")

          text = open("release_notes.txt", encoding="utf-8").read()
          block = re.search(r"Release Name: (\S+).*?\nRelease Notes:\n(.*?)\n---", text, re.S)
          if not block:
              fail("release_notes.txt", "the newest release must be a 'Release Name:' block ending in ---")
          if block.group(1) != version:
              fail("release_notes.txt", f"the newest notes are for {block.group(1)}, but pubspec.yaml says {version}")
          notes = [line.strip() for line in block.group(2).strip().split("\n") if line.strip()]
          bad = [line for line in notes if not line.startswith("- ") or len(line) < 3]
          if not notes or bad:
              fail("release_notes.txt", f"every {version} note must be one '- ' line, not {bad[:1] or 'nothing'}")
          play = "\n".join(notes)
          if len(play) > PLAY_LIMIT:
              fail("release_notes.txt", f"the {version} notes are {len(play)} characters, over Play's {PLAY_LIMIT}")

          def write(path, content):
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          write("build/release/notes.md", play + "\n")
          write("build/release/whatsnew/whatsnew-en-US", play)
          write("build/release/play-release-notes.txt", f"<en-US>\n{play}\n</en-US>\n")
          write("build/release/version.env", f"VERSION_NAME={version}\nVERSION_CODE={code}\nTAG=v{version}\n")
          print(f"version {version}, version code {code}, notes {len(play)} characters")
          print(open("build/release/play-release-notes.txt", encoding="utf-8").read(), end="")
          EOF
          cat build/release/version.env >> "$GITHUB_ENV"

      # Before the long build, so a bad version fails fast. Earlier codes are read back from the release
      # notes, which is where this workflow records them.
      - name: Check the version
        env:
          HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::warning::tag $TAG already exists, so a real release would stop here"
            else
              echo "::error::tag $TAG already exists: raise the version in pubspec.yaml and add its notes to release_notes.txt"
              exit 1
            fi
          fi
          highest="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].body' \
            | grep -oE 'Version code: [0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1 || true)"
          if [ -n "$highest" ] && (( VERSION_CODE <= highest )); then
            echo "::error::version code $VERSION_CODE ($VERSION_NAME) is not above $highest, the highest code already released"
            exit 1
          fi
          if [ "$PLAY_TRACK" != none ]; then
            if [ "$HAS_PLAY_ACCOUNT" != true ]; then
              echo "::error::play_track is $PLAY_TRACK, but the repository has no PLAY_SERVICE_ACCOUNT_JSON secret"
              exit 1
            fi
            if [ "$HAS_UPLOAD_KEY" != true ]; then
              echo "::error::Play only takes builds signed with the upload key, and the repository has no ANDROID_KEYSTORE_* secrets"
              exit 1
            fi
          fi
          package="$(sed -n 's/^ *applicationId = "\(.*\)"$/\1/p' android/app/build.gradle.kts)"
          test -n "$package"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
          if [ "$DRY_RUN" = true ]; then
            echo "dry run: building $TITLE ($package) $VERSION_NAME with version code $VERSION_CODE, no tag, release or upload"
          else
            echo "releasing $TITLE ($package) $TAG with version code $VERSION_CODE, Play track: $PLAY_TRACK"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;${{ env.BUILD_TOOLS }}"
          log-accepted-android-sdk-licenses: false

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Locate the SDK tools and bundletool
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          tools="$sdk/build-tools/$BUILD_TOOLS"
          test -x "$tools/apksigner"
          test -x "$tools/aapt2"
          wget -qO "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL}/bundletool-all-${BUNDLETOOL}.jar"
          echo "SDK_TOOLS=$tools" >> "$GITHUB_ENV"

      # android/app/build.gradle.kts reads the key from ANDROID_KEYSTORE_*, so nothing secret is written into the repo.
      - name: Choose the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PINNED_SHA256: ${{ vars.UPLOAD_KEY_SHA256 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64$KEYSTORE_ALIAS$KEYSTORE_PASSWORD" ]; then
            if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
              echo "set all three of ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_ALIAS and ANDROID_KEYSTORE_PASSWORD, or none" >&2
              exit 1
            fi
            key="$RUNNER_TEMP/upload.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$key"
            sha="$(keytool -list -v -keystore "$key" -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p')"
            test -n "$sha"
            # Play rejects any upload not signed with the key it first saw, so a pinned key must match exactly.
            if [ -n "$PINNED_SHA256" ] && [ "$sha" != "$PINNED_SHA256" ]; then
              echo "::error::the upload key in this repository's secrets is $sha, but UPLOAD_KEY_SHA256 pins $PINNED_SHA256, the key Play knows"
              exit 1
            fi
            if [ -z "$PINNED_SHA256" ]; then
              echo "::warning::UPLOAD_KEY_SHA256 is not set, so nothing checks that this is the key Play knows"
            fi
            {
              echo "ANDROID_KEYSTORE_PATH=$key"
              echo "ANDROID_KEYSTORE_ALIAS=$KEYSTORE_ALIAS"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
              echo "UPLOAD_KEY=true"
              echo "KEY_SHA256=$sha"
            } >> "$GITHUB_ENV"
          else
            # Gradle falls back to the debug key, which a debug build makes on first use.
            echo "UPLOAD_KEY=false" >> "$GITHUB_ENV"
          fi

      - name: Build the AAB and the APK
        run: |
          set -euo pipefail
          flutter pub get
          flutter build appbundle --release --build-name "$VERSION_NAME" --build-number "$VERSION_CODE"
          flutter build apk --release --build-name "$VERSION_NAME" --build-number "$VERSION_CODE"
          mkdir -p build/android
          out="build/android/securevault-${VERSION_NAME}"
          cp build/app/outputs/bundle/release/app-release.aab "$out.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "$out.apk"
          ls -l "$out.aab" "$out.apk"
          echo "AAB=$out.aab" >> "$GITHUB_ENV"
          echo "APK=$out.apk" >> "$GITHUB_ENV"
          if [ "$UPLOAD_KEY" = false ]; then
            sha="$(keytool -printcert -jarfile "$out.aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
            echo "KEY_SHA256=$sha" >> "$GITHUB_ENV"
          fi

      - name: Verify the APK
        run: |
          set -euo pipefail
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.log
          digest="$(echo "$KEY_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          grep -q "certificate SHA-256 digest: $digest" apksigner.log
          badging="$("$SDK_TOOLS/aapt2" dump badging "$APK")"
          grep -E "^(package|sdkVersion|targetSdkVersion|application-label):" <<< "$badging"
          grep -q "^package: name='$PACKAGE' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$badging"
          grep -q "^targetSdkVersion:'36'" <<< "$badging"
          permissions="$(sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" <<< "$badging" | sort | xargs)"
          echo "APK permissions: $permissions"
          test "$permissions" = "$(echo $EXPECTED_PERMISSIONS | tr ' ' '\n' | sort | xargs)"

      - name: Verify the AAB
        run: |
          set -euo pipefail
          # A self-signed upload key and AGP's bundle layout always draw jarsigner warnings, so only a failure prints them.
          jarsigner -verify "$AAB" > jarsigner.log 2>&1 || true
          if ! grep "jar verified" jarsigner.log; then
            cat jarsigner.log
            exit 1
          fi
          keytool -printcert -jarfile "$AAB" | grep "SHA256: $KEY_SHA256"
          manifest() { java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$AAB" --xpath "$1"; }
          echo "package $(manifest /manifest/@package), versionCode $(manifest /manifest/@android:versionCode)," \
               "versionName $(manifest /manifest/@android:versionName)," \
               "targetSdkVersion $(manifest /manifest/uses-sdk/@android:targetSdkVersion)," \
               "minSdkVersion $(manifest /manifest/uses-sdk/@android:minSdkVersion)"
          test "$(manifest /manifest/@package)" = "$PACKAGE"
          test "$(manifest /manifest/@android:versionCode)" = "$VERSION_CODE"
          test "$(manifest /manifest/@android:versionName)" = "$VERSION_NAME"
          test "$(manifest /manifest/uses-sdk/@android:targetSdkVersion)" = 36
          echo "MIN_SDK=$(manifest /manifest/uses-sdk/@android:minSdkVersion)" >> "$GITHUB_ENV"
          permissions="$(manifest /manifest/uses-permission/@android:name | sort | xargs)"
          echo "AAB permissions: $permissions"
          test "$permissions" = "$(echo $EXPECTED_PERMISSIONS | tr ' ' '\n' | sort | xargs)"
          # The vault stays out of Android's backups and phone-to-phone transfers.
          test "$(manifest /manifest/application/@android:allowBackup)" = false
          test -n "$(manifest /manifest/application/@android:dataExtractionRules)"
          echo "allowBackup false, dataExtractionRules set"

      # The "Version code: N" line is what the version check reads back on later runs.
      - name: Write the release notes
        run: |
          set -euo pipefail
          if [ "$UPLOAD_KEY" = true ]; then
            signing="Signed with the upload key from the repository secrets, so the AAB can go to Google Play."
          else
            signing="**Signed with a debug key: sideload only, not uploadable to Play.**"
          fi
          case "$PLAY_TRACK" in
            internal) play="sent to internal testing" ;;
            alpha) play="sent to closed testing (the alpha track)" ;;
            beta) play="sent to open testing (the beta track)" ;;
            production) play="a draft on production: roll it out with store/tools/play_release.py or in Play Console" ;;
            *) play="not uploaded, the AAB is attached for Play Console" ;;
          esac
          if [ "$DRY_RUN" = true ]; then
            play="not uploaded (dry run)"
          fi
          {
            cat build/release/notes.md
            echo
            echo "### Build"
            echo
            echo "- Package: \`$PACKAGE\`"
            echo "- Version code: $VERSION_CODE"
            echo "- Target SDK 36, min SDK $MIN_SDK"
            echo "- Signer SHA-256: \`$KEY_SHA256\`"
            echo "- $signing"
            echo "- Google Play: $play"
            echo "- Commit: $GITHUB_SHA"
            echo
            echo "\`$(basename "$AAB")\` is the bundle for Google Play. \`$(basename "$APK")\` installs straight on a phone."
            echo
            echo "### Google Play \"What's new\""
            echo
            echo '```'
            cat build/release/play-release-notes.txt
            echo '```'
          } > build/release/body.md
          cat build/release/body.md

      # A real release keeps its files on the GitHub release. Only a dry run needs a copy to download.
      - uses: actions/upload-artifact@v6
        if: ${{ inputs.dry_run }}
        with:
          name: securevault-${{ env.VERSION_NAME }}-android
          path: |
            build/android/*.aab
            build/android/*.apk
            build/release/play-release-notes.txt
          if-no-files-found: error
          retention-days: 3

      # Before the GitHub release, so a failed upload leaves no tag and the same version can run again.
      - name: Upload to Google Play
        if: ${{ !inputs.dry_run && inputs.play_track != 'none' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE }}
          releaseFiles: ${{ env.AAB }}
          releaseName: ${{ env.VERSION_CODE }} (${{ env.VERSION_NAME }})
          tracks: ${{ inputs.play_track }}
          status: ${{ inputs.play_track == 'production' && 'draft' || 'completed' }}
          whatsNewDirectory: build/release/whatsnew

      - name: Publish the GitHub release
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$AAB" "$APK" build/release/play-release-notes.txt --target "$GITHUB_SHA" \
            --title "$TITLE $VERSION_NAME" --notes-file build/release/body.md --latest
          gh release view "$TAG" --json url,isPrerelease,assets --jq '.url, "prerelease: \(.isPrerelease)", (.assets[] | "\(.name) \(.size) bytes")'
