name: Create Release with APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Generate Tag Name
        id: generate_tag
        shell: bash
        run: |
          version=$(grep "^version:" pubspec.yaml | sed 's/version: *//; s/+.*//')
          tagName="SecureVault_v$version"
          echo "tag_name=$tagName" >> $GITHUB_OUTPUT

      - name: Create and Push Git Tag
        shell: bash
        run: |
          tag="${{ steps.generate_tag.outputs.tag_name }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag $tag
          git push origin $tag

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## SecureVault APK Release

            This release contains the Android APK build of SecureVault.
            Download and install on Android devices.

            **Version:** ${{ steps.generate_tag.outputs.tag_name }}
