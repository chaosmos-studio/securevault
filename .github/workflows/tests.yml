name: Tests

on:
  push:
    branches: [main]
    paths: ["**", "!website/**", "!assets/store/**", "!docs/**", "!**.md"]
  pull_request:
    paths: ["**", "!website/**", "!assets/store/**", "!docs/**", "!**.md"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The version the app is built and released with. Change it here and in release-android.yml together.
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test --concurrency=2
