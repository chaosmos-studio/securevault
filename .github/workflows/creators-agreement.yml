# Opens the creators' agreement issue and records each creator's "I agree" as a file on main.
# Every action here is taken by github-actions[bot] with this workflow's token.
name: Creators' agreement

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Open a test issue that names the creators without mentioning them
        type: boolean
        default: false
      refresh:
        description: Put the newest agreement text into the open issue instead of opening one. Refused once anyone has signed
        type: boolean
        default: false
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [edited]

permissions:
  issues: write
  contents: write

# Two signatures landing at once would both count the records before either is written.
concurrency:
  group: creators-agreement
  cancel-in-progress: false

env:
  CREATORS: shravanngoswamii,AJ0070,jitendravjh
  AGREEMENT: .github/agreements/AGREEMENT.md
  LABEL: agreement

jobs:
  agreement:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'agreement')
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const creators = process.env.CREATORS.split(',');
            const folder = '.github/agreements';
            const marker = '<!-- creators-agreement -->';
            const branch = context.payload.repository.default_branch;
            const blob = (sha, path) => `https://github.com/${owner}/${repo}/blob/${sha}/${path}`;

            const creatorFor = (login) => creators.find((c) => c.toLowerCase() === login.toLowerCase());
            const list = (names) => (names.length === 1 ? names[0] : `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}`);
            const all = creators.length === 1 ? 'The creator has' : `All ${['', '', 'two', 'three', 'four', 'five'][creators.length] || creators.length} creators have`;
            const shaIn = (body) => (body.match(/<!-- agreement-sha: ([0-9a-f]{40}) -->/) || [])[1];

            async function signed() {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: folder, ref: branch });
                return data.filter((f) => f.name.endsWith('.json')).map((f) => f.name.slice(0, -5));
              } catch (err) {
                if (err.status === 404) return [];
                throw err;
              }
            }

            async function record(login) {
              const path = `${folder}/${login}.json`;
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
                const { data: commits } = await github.rest.repos.listCommits({ owner, repo, path, sha: branch, per_page: 1 });
                return { path, commit: commits[0], data: JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')) };
              } catch (err) {
                if (err.status === 404) return null;
                throw err;
              }
            }

            const say = (number, body) => github.rest.issues.createComment({ owner, repo, issue_number: number, body });

            if (context.eventName === 'workflow_dispatch') {
              const dry = String(context.payload.inputs.dry_run) === 'true';
              const refresh = String(context.payload.inputs.refresh) === 'true';
              const { data: commits } = await github.rest.repos.listCommits({ owner, repo, path: process.env.AGREEMENT, sha: branch, per_page: 1 });
              const sha = commits[0].sha;
              const { data: file } = await github.rest.repos.getContent({ owner, repo, path: process.env.AGREEMENT, ref: sha });
              const text = Buffer.from(file.content, 'base64').toString('utf8');
              const name = (c) => (dry ? `\`${c}\`` : `@${c}`);
              const who = list(creators.map(name));
              const body = [
                marker,
                `<!-- agreement-sha: ${sha} -->`,
                `SecureVault is now open source, published by Chaosmos, and it stays a free gift to everyone who uses it. ${who}, you made it together, and this asks each of you to agree to how it goes on from here. Thank you for building it.`,
                '---',
                text.trim(),
                '---',
                `This is the text at [${sha.slice(0, 7)}](${blob(sha, process.env.AGREEMENT)}).`,
                `Comment exactly **I agree** to sign. Only ${who} can sign.`,
              ].join('\n\n');

              if (refresh) {
                const issues = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, labels: process.env.LABEL, state: 'all', per_page: 100 }))
                  .filter((i) => !i.pull_request && (i.body || '').includes(marker));
                if (issues.length !== 1) {
                  core.setFailed(`expected one agreement issue, found ${issues.length}`);
                  return;
                }
                const target = issues[0];
                const recorded = await signed();
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: target.number, per_page: 100 });
                const pending = comments.filter((c) => creatorFor(c.user.login) && /^\s*i agree[.!]?\s*$/i.test(c.body || '')).map((c) => c.user.login);
                if (target.state !== 'open' || recorded.length > 0 || pending.length > 0) {
                  core.setFailed(`#${target.number} is ${target.state} with signatures from ${list([...new Set([...recorded, ...pending])]) || 'nobody'}, so its text stays as it was signed`);
                  return;
                }
                await github.rest.issues.update({ owner, repo, issue_number: target.number, body });
                core.notice(`Refreshed ${target.html_url} to the agreement at ${sha.slice(0, 7)}`);
                return;
              }

              try {
                await github.rest.issues.createLabel({ owner, repo, name: process.env.LABEL, color: '2c8058', description: "The creators' agreement" });
              } catch (err) {
                if (err.status !== 422) throw err;
              }
              const title = `${dry ? '[Test] ' : ''}Creators' agreement: SecureVault is open source at Chaosmos`;
              const { data: issue } = await github.rest.issues.create({ owner, repo, title, body, labels: [process.env.LABEL] });
              try {
                await github.graphql('mutation($id: ID!) { pinIssue(input: { issueId: $id }) { issue { number } } }', { id: issue.node_id });
              } catch (err) {
                core.warning(`Could not pin the issue: ${err.message}`);
              }
              core.notice(`Opened ${issue.html_url}`);
              return;
            }

            const issue = context.payload.issue;
            if (!(issue.body || '').includes(marker)) return;
            const sha = shaIn(issue.body);

            if (context.eventName === 'issues') {
              if ((await signed()).length > 0) {
                await say(issue.number, `The issue text was edited after signatures were recorded. Each signature stands for the agreement at [${sha.slice(0, 7)}](${blob(sha, process.env.AGREEMENT)}), as its record in \`${folder}/\` says.`);
              }
              return;
            }

            const comment = context.payload.comment;
            const login = comment.user.login;
            if (comment.user.type === 'Bot') return;
            const creator = creatorFor(login);

            if (context.payload.action !== 'created') {
              const held = creator && (await record(creator));
              if (held && held.data.comment_id === comment.id) {
                const what = context.payload.action === 'deleted' ? 'was deleted' : 'was edited';
                await say(issue.number, `@${login}'s signed comment ${what}. The signature stands as recorded in ${held.commit.html_url}.`);
              }
              return;
            }

            if (!creator) {
              const tag = `<!-- not-a-creator:${login.toLowerCase()} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number, per_page: 100 });
              if (!comments.some((c) => (c.body || '').includes(tag))) {
                await say(issue.number, `${tag}\nThanks for your interest, @${login}. Only the three creators of SecureVault sign this agreement, so other comments here are not recorded.`);
              }
              return;
            }

            if (!/^\s*i agree[.!]?\s*$/i.test(comment.body)) return;
            const before = await signed();
            if (before.some((s) => s.toLowerCase() === creator.toLowerCase())) return;

            await github.rest.reactions.createForIssueComment({ owner, repo, comment_id: comment.id, content: '+1' });
            const entry = {
              login,
              user_id: comment.user.id,
              comment_id: comment.id,
              comment_url: comment.html_url,
              comment_created_at: comment.created_at,
              body: comment.body,
              agreement_sha: sha,
              agreement_url: blob(sha, process.env.AGREEMENT),
              issue_url: issue.html_url,
            };
            const { data: written } = await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch,
              path: `${folder}/${creator}.json`,
              message: `Record ${creator}'s signature of the creators' agreement`,
              content: Buffer.from(JSON.stringify(entry, null, 2) + '\n').toString('base64'),
            });
            const count = before.length + 1;
            await say(issue.number, `Thanks @${login}, recorded in ${written.commit.html_url}. ${count} of ${creators.length} signed.`);

            if (count === creators.length) {
              const lines = [];
              for (const c of creators) {
                const held = await record(c);
                lines.push(`- @${held.data.login}: [comment](${held.data.comment_url}), recorded in ${held.commit.html_url}`);
              }
              await say(issue.number, [`${all} signed the agreement at [${sha.slice(0, 7)}](${blob(sha, process.env.AGREEMENT)}).`, ...lines, '', 'Thank you. This issue is now closed and locked.'].join('\n'));
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
              await github.rest.issues.lock({ owner, repo, issue_number: issue.number, lock_reason: 'resolved' });
            }
